<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>still / 陪伴 AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#101214; --panel:#171a1d; --panel-2:#1d2125; --line:#2a2f34; --text:#f2f3f2; --muted:#8f989f; --accent:#d9f36a; --accent-ink:#171a10; --bubble:#20252a; }
    * { box-sizing:border-box; } body { margin:0; color:var(--text); background:radial-gradient(circle at 85% -10%, #27322c 0, transparent 32%), var(--bg); font-family:Manrope, system-ui, sans-serif; min-height:100vh; }
    .shell { min-height:100vh; display:grid; grid-template-columns:268px minmax(0, 1fr) 290px; max-width:1500px; margin:auto; }
    aside, .insights { border-color:var(--line); } aside { border-right:1px solid var(--line); padding:28px 20px; display:flex; flex-direction:column; gap:34px; } .brand { display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.04em; } .mark { width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700; } .eyebrow { font:500 11px 'DM Mono',monospace; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); }
    .new-chat { border:1px solid #3b4349; background:transparent; color:var(--text); padding:12px 14px; border-radius:8px; text-align:left; cursor:pointer; font:500 13px Manrope; } .new-chat:hover { border-color:var(--accent); color:var(--accent); }
    .nav { display:grid; gap:7px; } .nav-item { padding:10px 12px; color:var(--muted); border-radius:7px; font-size:13px; } .nav-item.active { background:var(--panel-2); color:var(--text); } .side-bottom { margin-top:auto; color:var(--muted); font-size:12px; line-height:1.7; }
    main { min-width:0; display:flex; flex-direction:column; height:100vh; } .topbar { height:78px; padding:0 38px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; } .status { display:flex; gap:9px; align-items:center; color:var(--muted); font-size:12px; } .dot { width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 4px #d9f36a18; } .content { width:min(760px,100%); margin:0 auto; padding:54px 26px 24px; flex:1; display:flex; flex-direction:column; overflow:hidden; } h1 { font-size:32px; margin:0 0 8px; letter-spacing:-.03em; } .sub { color:var(--muted); font-size:13px; margin:0 0 32px; } .messages { overflow:auto; flex:1; padding-right:5px; } .message { display:flex; gap:13px; margin:21px 0; align-items:flex-start; } .avatar { width:29px;height:29px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:700;flex:0 0 auto; } .ai .avatar { background:var(--accent); color:var(--accent-ink); } .user { flex-direction:row-reverse; } .user .avatar { background:#30363b; color:#dae0e3; } .bubble { max-width:75%; background:var(--bubble); border:1px solid #292f34; border-radius:4px 12px 12px 12px; padding:12px 15px; line-height:1.7; font-size:14px; white-space:pre-wrap; } .user .bubble { border-radius:12px 4px 12px 12px; background:#2b3238; } .stamp { display:block; color:var(--muted); font:10px 'DM Mono',monospace; margin-top:7px; }
    .composer { margin-top:18px; display:flex; gap:10px; align-items:flex-end; background:var(--panel); border:1px solid #343b40; border-radius:10px; padding:10px; } textarea { flex:1; resize:none; min-height:44px; max-height:140px; background:transparent; border:0; outline:0; color:var(--text); font:14px Manrope; line-height:1.6; padding:7px 8px; } textarea::placeholder { color:#667078; } .send { width:42px;height:42px;border:0;border-radius:7px;background:var(--accent);color:var(--accent-ink);cursor:pointer;font-size:18px; } .send:disabled { opacity:.5; cursor:wait; }
    .insights { border-left:1px solid var(--line); padding:28px 22px; } .insights h2 { font-size:14px; margin:0 0 22px; } .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:12px; } .card-label { color:var(--muted); font:10px 'DM Mono',monospace; text-transform:uppercase; letter-spacing:.12em; } .card-value { font-size:14px; margin-top:12px; line-height:1.5; } .signal { display:flex; justify-content:space-between; color:var(--muted); font-size:12px; padding:7px 0; border-bottom:1px solid #252a2e; } .signal:last-child {border:0;} .signal b { color:var(--text); font-weight:500; }
    @media (max-width: 1000px) { .shell { grid-template-columns:220px minmax(0,1fr); } .insights { display:none; } } @media (max-width: 640px) { aside { display:none; } .topbar { padding:0 18px; } .content { padding:34px 16px 16px; } h1 {font-size:26px;} .bubble {max-width:88%;} }
  </style>
</head>
<body>
  <div class="shell">
    <aside><div class="brand"><div class="mark">s</div><span>still / 陪伴</span></div><button class="new-chat" id="newChat">＋ 新的对话</button><nav class="nav"><div class="eyebrow">workspace</div><div class="nav-item active">今日对话</div><div class="nav-item">记忆档案</div><div class="nav-item">关于 still</div></nav><div class="side-bottom">保持联系，记住那些<br>值得被记住的事。</div></aside>
    <main><header class="topbar"><div><div class="eyebrow">companion / 01</div></div><div class="status"><span class="dot"></span><span id="statusText">在线 · 随时听你说</span></div></header><section class="content"><h1>晚上好，今天还好吗？</h1><p class="sub">我会记得你的近况，也会认真听完这一句。</p><div class="messages" id="messages"><div class="message ai"><div class="avatar">s</div><div><div class="bubble">我在。今天想从哪里开始？不用组织得很完整，想到什么就说什么。</div><span class="stamp">刚刚 · still</span></div></div></div><form class="composer" id="composer"><textarea id="input" rows="1" placeholder="写下此刻的想法…" aria-label="消息"></textarea><button class="send" id="send" aria-label="发送">↑</button></form></section></main>
    <section class="insights"><h2>关系状态</h2><div class="card"><div class="card-label">connection</div><div class="card-value">稳定连接中<br><span style="color:var(--muted);font-size:12px">我会在这里，慢一点也没关系。</span></div></div><div class="card"><div class="card-label">today's signals</div><div class="signal"><span>回应模式</span><b>温柔陪伴</b></div><div class="signal"><span>知识辅助</span><b>自动感知</b></div><div class="signal"><span>天气提醒</span><b>已准备</b></div></div><div class="card"><div class="card-label">privacy</div><div class="card-value" style="font-size:12px;color:var(--muted)">你的对话只在本地服务中处理。长期记忆由后端保存，可随时清理。</div></div></section>
  </div>
  <script>
    const messages = document.querySelector('#messages'), input = document.querySelector('#input'), composer = document.querySelector('#composer'), send = document.querySelector('#send'), statusText = document.querySelector('#statusText');
    const API_BASE = location.protocol === 'file:' ? 'http://127.0.0.1:8000' : '';
    let history = [];
    const time = () => new Date().toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    function addMessage(role, text, stamp=time()) { const wrap=document.createElement('div'); wrap.className=`message ${role==='user'?'user':'ai'}`; wrap.innerHTML=`<div class="avatar">${role==='user'?'你':'s'}</div><div><div class="bubble"></div><span class="stamp">${stamp} · ${role==='user'?'你':'still'}</span></div>`; wrap.querySelector('.bubble').textContent=text; messages.appendChild(wrap); messages.scrollTop=messages.scrollHeight; return wrap; }
    input.addEventListener('input',()=>{ input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,140)+'px'; });
    document.querySelector('#newChat').onclick=()=>{ history=[]; messages.innerHTML=''; addMessage('ai','新的对话已经准备好了。你想先告诉我什么？'); input.focus(); };
    composer.onsubmit=async (e)=>{ e.preventDefault(); const text=input.value.trim(); if(!text||send.disabled)return; addMessage('user',text); history.push({role:'user',content:text}); input.value=''; input.style.height='auto'; send.disabled=true; statusText.textContent='思考中 · 正在认真听'; const pending=addMessage('ai','…'); try { const res=await fetch(`${API_BASE}/api/chat`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,history})}); const data=await res.json(); if(!res.ok) throw new Error(data.detail||'服务暂时不可用'); pending.querySelector('.bubble').textContent=data.reply; pending.querySelector('.stamp').textContent=`${time()} · still`; history.push({role:'assistant',content:data.reply}); } catch(err) { const hint = err instanceof TypeError ? '请先运行后端，并通过 http://127.0.0.1:8000 打开页面。' : err.message; pending.querySelector('.bubble').textContent=`暂时无法回复：${hint}`; } finally { send.disabled=false; statusText.textContent='在线 · 随时听你说'; messages.scrollTop=messages.scrollHeight; input.focus(); } };
    fetch(`${API_BASE}/api/health`).then(r=>{ if(!r.ok) throw new Error(); statusText.textContent='在线 · 随时听你说'; }).catch(()=>{ statusText.textContent='后端未启动 · 请运行服务'; });
  </script>
</body>
</html>
